root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/server ./cmd/api"
bin = "./tmp/server"
delay = 200
include_ext = ["go", "tpl", "tmpl", "html"]
exclude_dir = ["tmp", "vendor", "bin", "internal/mocks"]
exclude_regex = ["_test\\.go"]
stop_on_error = true
send_interrupt = true
kill_delay = 500
# Polling : indispensable pour detecter les changements sur bind mount Windows/Docker.
poll = true
poll_interval = 500

[log]
time = true

[misc]
clean_on_exit = true
